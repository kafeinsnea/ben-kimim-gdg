<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Kimim? - Oyun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Başlangıç Ekranı -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <div class="welcome-header">
                <h1 class="welcome-title">🎮 Ben Kimim?</h1>
                <p class="welcome-subtitle">Ünlü kişileri tanıma oyunu</p>
            </div>
            
            <div class="instructions-box">
                <h2>📖 Nasıl Oynanır?</h2>
                <div class="instruction-item">
                    <div class="instruction-icon correct-icon">👉</div>
                    <div class="instruction-text">
                        <strong>Sağa Kaydır veya ✅</strong>
                        <p>Kişiyi tanıyorsan "Doğru"</p>
                    </div>
                </div>
                <div class="instruction-item">
                    <div class="instruction-icon pass-icon">👈</div>
                    <div class="instruction-text">
                        <strong>Sola Kaydır veya ❌</strong>
                        <p>Kişiyi tanımıyorsan "Pas"</p>
                    </div>
                </div>
                <div class="instruction-item">
                    <div class="instruction-icon">🎯</div>
                    <div class="instruction-text">
                        <strong>Skor Sistemi</strong>
                        <p>En yüksek skoru hedefle!</p>
                    </div>
                </div>
            </div>

            <button class="start-btn" id="startBtn">
                <span>Oyuna Başla</span>
                <span class="start-arrow">→</span>
            </button>
        </div>
    </div>

    <!-- Oyun Alanı -->
    <div class="container" id="gameContainer" style="display: none;">
        <header>
            <h1>🎮 Ben Kimim?</h1>
            <div class="score">
                <span class="correct-count">✅ <strong id="correct">0</strong></span>
                <span class="pass-count">❌ <strong id="pass">0</strong></span>
            </div>
        </header>

        <div class="game-area">
            <div class="card-stack" id="cardStack">
                <!-- Kartlar JavaScript ile eklenecek -->
            </div>
            
            <div class="no-more-cards" id="noMoreCards" style="display: none;">
                <div class="game-over-content">
                    <h2>🎉 Oyun Bitti!</h2>
                    <div class="final-score">
                        <div class="score-item">
                            <span class="score-icon">✅</span>
                            <span class="score-label">Doğru</span>
                            <span class="score-value correct" id="finalCorrect">0</span>
                        </div>
                        <div class="score-item">
                            <span class="score-icon">❌</span>
                            <span class="score-label">Pas</span>
                            <span class="score-value pass" id="finalPass">0</span>
                        </div>
                    </div>
                    <button onclick="location.reload()" class="restart-btn">
                        🔄 Yeniden Başla
                    </button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn pass-btn" id="passBtn">
                <span class="btn-icon">❌</span>
                <span class="btn-text">PAS</span>
            </button>
            <button class="action-btn correct-btn" id="correctBtn">
                <span class="btn-icon">✅</span>
                <span class="btn-text">DOĞRU</span>
            </button>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">0 / 36</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
